<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Événements - Miftahoul Khayri</title><link rel="icon" href="khayri.jpeg"><link rel="stylesheet" href="style.css"></head><body>
<nav><div class="logo"><img src="khayri.jpeg" alt="Logo"><h2>Miftahoul Khayri</h2></div><div class="menu"><a href="index.html">Accueil</a><a href="historique.html">Historique</a><a href="xam-sa-dine.html">Xam sa diné</a><a href="actualites.html">Actualités</a><a href="evenements.html">Événements</a><a href="contact.html">Contact</a></div></nav>
<main class="page"><div class="page-header"><h1>Nos <span>Événements</span></h1><p>Retrouvez toutes les activités, rencontres, conférences et cérémonies du Dahira.</p></div><div id="events" class="card-grid"><div class="empty">Chargement...</div></div></main>
<footer>© 2026 <span>Dahira Miftahoul Khayri</span> — Tous droits réservés.</footer><script src="script.js"></script><script>
getContent().then(db=>{const box=document.getElementById('events');const events=[...db.events].sort((a,b)=>(a.date||'').localeCompare(b.date||''));box.innerHTML=events.map(e=>`<article class="card">${e.filename?`<img class="media-img" src="${fileUrl(e,'photos')}" alt="${escapeHTML(e.title)}">`:''}<div class="event-date">${escapeHTML(e.date||'Date à venir')}${e.time?' — '+escapeHTML(e.time):''}</div><h3>${escapeHTML(e.title)}</h3>${e.place?`<p class="event-info">📍 ${escapeHTML(e.place)}</p>`:''}${e.description?`<p>${escapeHTML(e.description)}</p>`:''}</article>`).join('')||'<div class="empty">Aucun événement publié pour le moment.</div>'}).catch(()=>document.getElementById('events').innerHTML='<div class="empty">Impossible de charger les événements.</div>');
</script></body></html>
