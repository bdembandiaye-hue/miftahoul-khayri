<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Actualités - Miftahoul Khayri</title><meta name="description" content="Photos, vidéos et audios du Daara Miftahoul Khayri : magals, kurels, conférences et activités."><link rel="canonical" href="https://dahira-miftahoul-khayri.onrender.com/actualites.html"><meta property="og:type" content="website"><meta property="og:site_name" content="Daara Miftahoul Khayri"><meta property="og:title" content="Actualités — Daara Miftahoul Khayri"><meta property="og:description" content="Photos, vidéos et audios du Daara Miftahoul Khayri : magals, kurels, conférences et activités."><meta property="og:url" content="https://dahira-miftahoul-khayri.onrender.com/actualites.html"><meta property="og:image" content="https://dahira-miftahoul-khayri.onrender.com/khayri.jpeg"><meta property="og:locale" content="fr_SN"><meta name="twitter:card" content="summary"><meta name="theme-color" content="#1F6FC5"><link rel="icon" href="khayri.jpeg"><link rel="stylesheet" href="style.css"></head><body>
<nav><div class="logo"><img src="khayri.jpeg" alt="Logo"><h2>Miftahoul Khayri</h2></div><div class="menu"><a href="index.html">Accueil</a><a href="historique.html">Historique</a><a href="xam-sa-dine.html">Xam sa diné</a><a href="actualites.html">Actualités</a><a href="evenements.html">Événements</a><a href="contact.html">Contact</a></div></nav>
<main class="page"><div class="page-header"><h1>Nos <span>Actualités</span></h1><p>Photos, vidéos et audios du Dahira : magals, kurels, conférences et activités.</p></div>
<div class="tabs" role="tablist"><button class="tab active" data-tab="photos">📸 Photos</button><button class="tab" data-tab="videos">🎬 Vidéos</button><button class="tab" data-tab="audios">🎧 Audios</button></div>
<section class="tab-panel" id="tab-photos"><div id="photos" class="gallery"><div class="empty">Chargement...</div></div></section>
<section class="tab-panel hidden" id="tab-videos"><div id="videos" class="video-grid"><div class="empty">Chargement...</div></div></section>
<section class="tab-panel hidden" id="tab-audios"><div id="audios" class="card-grid"><div class="empty">Chargement...</div></div></section>
</main>
<div class="lightbox hidden" id="lightbox" role="dialog" aria-modal="true"><button class="lb-close" aria-label="Fermer">✕</button><button class="lb-prev" aria-label="Précédente">‹</button><figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure><button class="lb-next" aria-label="Suivante">›</button></div>
<footer>© 2026 <span>Dahira Miftahoul Khayri</span> — Tous droits réservés.</footer><script src="script.js"></script><script src="i18n.js"></script><script>
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('hidden',p.id!=='tab-'+t.dataset.tab))});
let PHOTOS=[],cur=0;const lb=document.getElementById('lightbox');
function openLb(i){cur=(i+PHOTOS.length)%PHOTOS.length;const p=PHOTOS[cur];lbImg.src=fileUrl(p,'photos');lbImg.alt=p.title;lbCap.textContent=p.title+(p.description?' — '+p.description:'');lb.classList.remove('hidden')}
lb.querySelector('.lb-close').onclick=()=>lb.classList.add('hidden');lb.querySelector('.lb-prev').onclick=()=>openLb(cur-1);lb.querySelector('.lb-next').onclick=()=>openLb(cur+1);
lb.onclick=e=>{if(e.target===lb)lb.classList.add('hidden')};document.addEventListener('keydown',e=>{if(lb.classList.contains('hidden'))return;if(e.key==='Escape')lb.classList.add('hidden');if(e.key==='ArrowLeft')openLb(cur-1);if(e.key==='ArrowRight')openLb(cur+1)});
getContent().then(db=>{
  PHOTOS=[...db.photos].filter(p=>p.filename).reverse();
  photos.innerHTML=PHOTOS.map((p,i)=>`<button class="g-item" onclick="openLb(${i})"><img loading="lazy" src="${fileUrl(p,'photos')}" alt="${escapeHTML(p.title)}"><span>${escapeHTML(p.title)}</span></button>`).join('')||'<div class="empty">Aucune photo publiée.</div>';
  const vids=[...(db.videos||[])].reverse();
  videos.innerHTML=vids.map(v=>`<article class="card video-card"><div class="yt" data-id="${escapeHTML(v.youtube)}"><img loading="lazy" src="https://i.ytimg.com/vi/${encodeURIComponent(v.youtube)}/hqdefault.jpg" alt=""><span class="play">▶</span></div><h3>${escapeHTML(v.title)}</h3>${v.description?`<p>${escapeHTML(v.description)}</p>`:''}</article>`).join('')||'<div class="empty">Aucune vidéo publiée.</div>';
  videos.querySelectorAll('.yt').forEach(el=>el.onclick=()=>{el.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${el.dataset.id}?autoplay=1" title="Vidéo" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`});
  audios.innerHTML=[...db.audios].reverse().map(a=>`<article class="card"><div class="icon">🎧</div><h3>${escapeHTML(a.title)}</h3>${a.description?`<p>${escapeHTML(a.description)}</p>`:''}${a.filename?`<audio class="audio" controls preload="none" src="${fileUrl(a,'audios')}"></audio>`:''}</article>`).join('')||'<div class="empty">Aucun audio publié.</div>';
}).catch(()=>{photos.innerHTML='<div class="empty">Impossible de charger les actualités.</div>'});
</script></body></html>
