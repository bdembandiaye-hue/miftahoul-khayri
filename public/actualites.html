<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Actualités - Miftahoul Khayri</title><link rel="icon" href="khayri.jpeg"><link rel="stylesheet" href="style.css"></head><body>
<nav><div class="logo"><img src="khayri.jpeg" alt="Logo"><h2>Miftahoul Khayri</h2></div><div class="menu"><a href="index.html">Accueil</a><a href="historique.html">Historique</a><a href="xam-sa-dine.html">Xam sa diné</a><a href="actualites.html">Actualités</a><a href="evenements.html">Événements</a><a href="contact.html">Contact</a></div></nav>
<main class="page"><div class="page-header"><h1>Nos <span>Actualités</span></h1><p>Photos et audios publiés par l'administration du Dahira.</p></div><h2 style="margin:0 auto 20px;max-width:1150px">Photos</h2><div id="photos" class="card-grid"><div class="empty">Chargement...</div></div><h2 style="max-width:1150px;margin:50px auto 20px">Audios</h2><div id="audios" class="card-grid"><div class="empty">Chargement...</div></div></main>
<footer>© 2026 <span>Dahira Miftahoul Khayri</span> — Tous droits réservés.</footer><script src="script.js"></script><script>
getContent().then(db=>{document.getElementById('photos').innerHTML=db.photos.map(p=>`<article class="card">${p.filename?`<img class="media-img" src="${fileUrl(p,'photos')}" alt="${escapeHTML(p.title)}">`:''}<h3>${escapeHTML(p.title)}</h3>${p.description?`<p>${escapeHTML(p.description)}</p>`:''}</article>`).join('')||'<div class="empty">Aucune photo publiée.</div>';document.getElementById('audios').innerHTML=db.audios.map(a=>`<article class="card"><div class="icon">🎧</div><h3>${escapeHTML(a.title)}</h3>${a.description?`<p>${escapeHTML(a.description)}</p>`:''}${a.filename?`<audio class="audio" controls src="${fileUrl(a,'audios')}"></audio>`:''}</article>`).join('')||'<div class="empty">Aucun audio publié.</div>'}).catch(()=>{});
</script></body></html>
